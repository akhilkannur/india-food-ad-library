name: Weekly ad queue import

on:
  schedule:
    # 21:47 UTC Saturday = 03:17 Sunday in India.
    - cron: "47 21 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Import reviewed source records into the pending queue
        if: ${{ hashFiles('data/queue.json') != '' }}
        run: npm run import:queue
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
