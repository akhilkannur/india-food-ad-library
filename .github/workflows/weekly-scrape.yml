name: Run Indian food ad scraper

# Automatic scraping is driven by the worker's own cron triggers (see
# scraper-worker/wrangler.jsonc). This workflow is dispatch-only for manual
# backfills: the Free plan's daily browser quota cannot support both this and
# the scheduled worker crons, and back-to-back batch runs get rate limited.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Collection mode"
        required: true
        default: "refresh"
        type: choice
        options:
          - refresh
          - backfill
      brand:
        description: "Brand slug (blank runs a batch)"
        required: false
        default: ""
      limit:
        description: "Batch size: recommended 6-12 to stay under browser time limits"
        required: false
        default: "8"
      offset:
        description: "Start position in the brand list when brand is blank"
        required: false
        default: ""
      publish:
        description: "Publish all media-backed pending ads after this run"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: indian-food-ad-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Ask the protected Cloudflare scraper to run
        env:
          SCRAPER_WORKER_URL: ${{ secrets.SCRAPER_WORKER_URL }}
          SCRAPER_RUN_TOKEN: ${{ secrets.SCRAPER_RUN_TOKEN }}
          MODE_INPUT: ${{ inputs.mode }}
          BRAND_INPUT: ${{ inputs.brand }}
          LIMIT_INPUT: ${{ inputs.limit }}
          OFFSET_INPUT: ${{ inputs.offset }}
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          MODE="${MODE_INPUT:-refresh}"
          PUBLISH="${PUBLISH_INPUT:-true}"
          LIMIT="${LIMIT_INPUT:-8}"

          if [ -n "$BRAND_INPUT" ]; then
            echo "Scraping brand: $BRAND_INPUT"
            curl --fail-with-body --silent --show-error --max-time 600 \
              --request POST \
              --header "Authorization: Bearer $SCRAPER_RUN_TOKEN" \
              "$SCRAPER_WORKER_URL/run?mode=$MODE&publish=$PUBLISH&brand=$BRAND_INPUT" | tee scraper-result.json
          elif [ -n "$OFFSET_INPUT" ]; then
            echo "Scraping batch at offset: $OFFSET_INPUT (limit $LIMIT)"
            curl --fail-with-body --silent --show-error --max-time 600 \
              --request POST \
              --header "Authorization: Bearer $SCRAPER_RUN_TOKEN" \
              "$SCRAPER_WORKER_URL/run?mode=$MODE&publish=$PUBLISH&limit=$LIMIT&offset=$OFFSET_INPUT" | tee scraper-result.json
          else
            DAY=$(date -u +%u)
            if [ "$DAY" -eq 1 ]; then
              BATCH_OFFSETS="0 24 48 72"
            elif [ "$DAY" -eq 4 ]; then
              BATCH_OFFSETS="96 120 144 168"
            else
              BATCH_OFFSETS="0 24 48 72 96 120 144 168"
            fi
            echo "Running refresh for offsets: $BATCH_OFFSETS"
            mkdir -p reports
            for off in $BATCH_OFFSETS; do
              echo "Refreshing offset $off (limit $LIMIT)..."
              curl --fail-with-body --silent --show-error --max-time 600 \
                --request POST \
                --header "Authorization: Bearer $SCRAPER_RUN_TOKEN" \
                "$SCRAPER_WORKER_URL/run?mode=$MODE&publish=$PUBLISH&limit=$LIMIT&offset=$off" | tee "reports/scraper-result-$off.json"
              # Spread batches out: the Free plan throttles browser launches
              # and exhausts its daily quota quickly on back-to-back runs.
              sleep 60
            done
            FIRST_OFF=$(echo $BATCH_OFFSETS | awk '{print $1}')
            cp "reports/scraper-result-$FIRST_OFF.json" scraper-result.json
          fi
      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-report-${{ github.run_id }}
          path: |
            scraper-result.json
            reports/*.json
          if-no-files-found: warn
          retention-days: 14
