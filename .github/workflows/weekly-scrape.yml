name: Weekly Indian food ad scrape

on:
  schedule:
    # Monday 05:17 India time. The odd minute avoids the top-of-hour Actions rush.
    - cron: "47 23 * * 0"
  workflow_dispatch:
    inputs:
      brand_limit:
        description: "Only scrape the first N brands (0 = all)"
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: weekly-indian-food-ad-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - name: Install isolated scraper dependency
        run: pip install --requirement requirements.txt
      - name: Discover ads and queue new records for approval
        run: python scrape.py
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BRAND_LIMIT: ${{ inputs.brand_limit || '0' }}
          MAX_ADS_PER_BRAND: "24"
      - name: Upload scraper report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-report-${{ github.run_id }}
          path: scraper/artifacts/
          if-no-files-found: warn
          retention-days: 14
