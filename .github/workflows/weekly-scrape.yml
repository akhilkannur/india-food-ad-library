name: Run Indian food ad scraper

# Scheduled scraping runs here, not in worker Cron Triggers: the Workers Free
# plan caps the whole Cloudflare ACCOUNT at 5 cron triggers and other projects
# already hold 4, so only one trigger (the scraper's daily classify cron) fits.
# 4 batches/day x 6 brands rotates deterministically through the brand list -
# the batch offset is derived from the fire time, so no shared state is needed.
# One Workers Free browser-rendering quota (10 minutes/day) fits ~4 slots of
# ~2 browser minutes each; the dispatch inputs stay for manual backfills.
on:
  schedule:
    - cron: "30 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Collection mode"
        required: true
        default: "refresh"
        type: choice
        options:
          - refresh
          - backfill
      brand:
        description: "Brand slug (blank runs a batch)"
        required: false
        default: ""
      limit:
        description: "Batch size: recommended 6-12 to stay under browser time limits"
        required: false
        default: "8"
      offset:
        description: "Start position in the brand list when brand is blank"
        required: false
        default: ""
      publish:
        description: "Publish all media-backed pending ads after this run"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: indian-food-ad-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Ask the protected Cloudflare scraper to run
        env:
          SCRAPER_WORKER_URL: ${{ secrets.SCRAPER_WORKER_URL }}
          SCRAPER_RUN_TOKEN: ${{ secrets.SCRAPER_RUN_TOKEN }}
          MODE_INPUT: ${{ inputs.mode }}
          BRAND_INPUT: ${{ inputs.brand }}
          LIMIT_INPUT: ${{ inputs.limit }}
          OFFSET_INPUT: ${{ inputs.offset }}
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          MODE="${MODE_INPUT:-refresh}"
          PUBLISH="${PUBLISH_INPUT:-true}"
          LIMIT="${LIMIT_INPUT:-8}"

          if [ -n "$BRAND_INPUT" ]; then
            echo "Scraping brand: $BRAND_INPUT"
            curl --fail-with-body --silent --show-error --max-time 600 \
              --request POST \
              --header "Authorization: Bearer $SCRAPER_RUN_TOKEN" \
              "$SCRAPER_WORKER_URL/run?mode=$MODE&publish=$PUBLISH&brand=$BRAND_INPUT" | tee scraper-result.json
          elif [ -n "$OFFSET_INPUT" ]; then
            echo "Scraping batch at offset: $OFFSET_INPUT (limit $LIMIT)"
            curl --fail-with-body --silent --show-error --max-time 600 \
              --request POST \
              --header "Authorization: Bearer $SCRAPER_RUN_TOKEN" \
              "$SCRAPER_WORKER_URL/run?mode=$MODE&publish=$PUBLISH&limit=$LIMIT&offset=$OFFSET_INPUT" | tee scraper-result.json
          else
            # Scheduled fire: rotate through the brand list deterministically.
            # 6 brands/batch x 4 fires/day x 8 days = the full 192-brand list.
            EPOCH_DAY=$(( $(date -u +%s) / 86400 ))
            HOUR=$(date -u +%H)
            if [ "$HOUR" -ge 19 ]; then SLOT_OF_DAY=3
            elif [ "$HOUR" -ge 13 ]; then SLOT_OF_DAY=2
            elif [ "$HOUR" -ge 7 ]; then SLOT_OF_DAY=1
            else SLOT_OF_DAY=0; fi
            OFF=$(( ( (EPOCH_DAY * 4 + SLOT_OF_DAY) % 32 ) * 6 ))
            BATCH_LIMIT=6
            echo "Scraping rotated batch at offset $OFF (limit $BATCH_LIMIT)"
            curl --fail-with-body --silent --show-error --max-time 600 \
              --request POST \
              --header "Authorization: Bearer $SCRAPER_RUN_TOKEN" \
              "$SCRAPER_WORKER_URL/run?mode=$MODE&publish=$PUBLISH&limit=$BATCH_LIMIT&offset=$OFF" | tee scraper-result.json
          fi
      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-report-${{ github.run_id }}
          path: |
            scraper-result.json
            reports/*.json
          if-no-files-found: warn
          retention-days: 14
