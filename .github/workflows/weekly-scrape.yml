name: Run Indian food ad scraper

on:
  workflow_dispatch:
    inputs:
      brand:
        description: "Brand slug (blank runs all brands)"
        required: false
        default: ""
      limit:
        description: "First N brands when brand is blank (0 runs all)"
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: indian-food-ad-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ask the protected Cloudflare scraper to run
        env:
          SCRAPER_WORKER_URL: ${{ secrets.SCRAPER_WORKER_URL }}
          SCRAPER_RUN_TOKEN: ${{ secrets.SCRAPER_RUN_TOKEN }}
          BRAND: ${{ inputs.brand }}
          LIMIT: ${{ inputs.limit }}
        run: |
          query=""
          if [ -n "$BRAND" ]; then
            query="?brand=$BRAND"
          elif [ "$LIMIT" != "0" ]; then
            query="?limit=$LIMIT"
          fi
          curl --fail-with-body --silent --show-error --max-time 600 \
            --request POST \
            --header "Authorization: Bearer $SCRAPER_RUN_TOKEN" \
            "$SCRAPER_WORKER_URL/run$query" | tee scraper-result.json
      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-report-${{ github.run_id }}
          path: scraper-result.json
          if-no-files-found: warn
          retention-days: 14
