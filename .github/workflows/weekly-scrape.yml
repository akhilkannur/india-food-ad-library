name: Run Indian food ad scraper

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Collection mode"
        required: true
        default: "backfill"
        type: choice
        options:
          - backfill
          - refresh
      brand:
        description: "Brand slug (blank runs a batch)"
        required: false
        default: ""
      limit:
        description: "Batch size: backfill max 12, refresh max 24"
        required: false
        default: "12"
      offset:
        description: "Start position in the brand list when brand is blank"
        required: false
        default: "0"
      ai:
        description: "Optional Gemini classifications (0–12; zero is fastest)"
        required: false
        default: "0"
      publish:
        description: "Publish all media-backed pending ads after this run"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: indian-food-ad-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ask the protected Cloudflare scraper to run
        env:
          SCRAPER_WORKER_URL: ${{ secrets.SCRAPER_WORKER_URL }}
          SCRAPER_RUN_TOKEN: ${{ secrets.SCRAPER_RUN_TOKEN }}
          MODE: ${{ inputs.mode }}
          BRAND: ${{ inputs.brand }}
          LIMIT: ${{ inputs.limit }}
          OFFSET: ${{ inputs.offset }}
          AI: ${{ inputs.ai }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          query="?mode=$MODE&ai=$AI&publish=$PUBLISH"
          if [ -n "$BRAND" ]; then
            query="$query&brand=$BRAND"
          else
            query="$query&limit=$LIMIT&offset=$OFFSET"
          fi
          curl --fail-with-body --silent --show-error --max-time 600 \
            --request POST \
            --header "Authorization: Bearer $SCRAPER_RUN_TOKEN" \
            "$SCRAPER_WORKER_URL/run$query" | tee scraper-result.json
      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-report-${{ github.run_id }}
          path: scraper-result.json
          if-no-files-found: warn
          retention-days: 14
