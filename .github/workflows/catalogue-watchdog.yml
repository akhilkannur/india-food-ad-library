name: Catalogue watchdog

# Fails (and GitHub emails the repo owner) when the public library looks
# unhealthy, so nobody has to check the site by hand.
"on":
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check site, catalogue size and pipeline freshness
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SITE_URL: https://adlibrary.store
          MIN_ADS: "300"
        run: |
          PROBLEMS=0
          fail() { echo "::error::$1"; PROBLEMS=$((PROBLEMS + 1)); }

          HOME_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" --max-time 60 "$SITE_URL/")
          [ "$HOME_STATUS" = "200" ] || fail "Homepage returned HTTP $HOME_STATUS"

          TOTAL=$(curl --silent --max-time 60 "$SITE_URL/api/ads?limit=1" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).total??0)}catch{console.log(0)}})')
          echo "Public catalogue: $TOTAL ads"
          [ "$TOTAL" -ge "$MIN_ADS" ] || fail "Only $TOTAL ads are public (floor is $MIN_ADS)"

          # A pipeline that silently stops is the usual cause of an emptying
          # library, so require a recent successful run of each stage.
          check_recent() {
            local workflow="$1" hours="$2"
            local last
            last=$(gh run list --repo "$REPO" --workflow "$workflow" --status success --limit 1 --json createdAt --jq '.[0].createdAt // empty')
            if [ -z "$last" ]; then fail "$workflow has never succeeded"; return; fi
            local age=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 3600 ))
            echo "$workflow: last success ${age}h ago"
            [ "$age" -le "$hours" ] || fail "$workflow has not succeeded for ${age}h"
          }
          check_recent weekly-scrape.yml 24
          check_recent mirror-creatives.yml 6
          check_recent validate-creatives.yml 48

          [ "$PROBLEMS" -eq 0 ] || exit 1
          echo "All checks passed."
